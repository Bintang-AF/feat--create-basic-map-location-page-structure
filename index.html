<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Map Location Finder</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"
        integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.95)),
                url("https://images.unsplash.com/photo-1524666041070-9cff3c4a7c8a?q=80&w=1600&auto=format&fit=crop");

            background-size: cover;
            background-position: center;

            color: white;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }

/* HEADER */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .map-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .header p {
            color: #cbd5e1;
            font-size: 15px;
        }

 /* SEARCH BOX */
        .search-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
        }

        .search-title {
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .search-area {
            display: flex;
            gap: 10px;
        }

        .search-area input {
            flex: 1;
            padding: 15px 18px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            background: white;
            color: #1e293b;
        }

        .search-area button {
            padding: 0 25px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-area button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        /* STATUS */
        #status {
            margin-top: 15px;
            color: #cbd5e1;
            font-size: 14px;
        }
 /* RESULT */
        #hasil {
            display: grid;
            gap: 18px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.95);
            color: #1e293b;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            transition: 0.2s;
        }

        .result-card:hover {
            transform: translateY(-3px);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .location-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .result-header h2 {
            font-size: 21px;
        }

        .result-header span {
            color: #64748b;
            font-size: 13px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .data-item {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
        }

        .data-label {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .data-value {
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
        }

        .type-badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .coordinate {
            color: #2563eb;
        }
